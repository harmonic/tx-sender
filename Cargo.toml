[package]
name = "harmonic-tx-sender"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime / networking
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
quinn = "0.11.9"
rustls = { version = "0.23.36", features = ["std", "ring"], default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"

# gRPC for direct block-engine bundle delivery.
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Config / misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = { version = "0.8", features = ["small_rng"] }
bincode = "1.3.3"
bs58 = "0.5"
anyhow = "1"

# Block-engine protos (gRPC SearcherService + AuthService).
block-engine-protos = { package = "protos-tonic", path = "/home/devin/auction/protos-tonic" }

# Solana split crates (versions matched to salsa workspace pins)
solana-hash = "4.2.0"
solana-keypair = "3.1.0"
solana-signer = "3.0.0"
solana-pubkey = "4.1.0"
solana-instruction = "3.2.0"
solana-message = "3.1.0"
solana-transaction = "3.1.0"
solana-compute-budget-interface = "3.0.0"
solana-system-interface = { version = "3.0", features = ["bincode"] }
solana-commitment-config = "3.1.1"
solana-clock = "3.0.1"

# Path deps into salsa workspace (RPC + TLS cert generation only)
solana-rpc-client = { path = "/home/devin/salsa/rpc-client", default-features = false }
solana-rpc-client-api = { path = "/home/devin/salsa/rpc-client-api" }
solana-tls-utils = { path = "/home/devin/salsa/tls-utils", features = ["agave-unstable-api"] }

[profile.release]
lto = "thin"
codegen-units = 1
